<style>
/* Layout: app shell; sticky header with tabs, single working column (max 880px), cards only for rooms and claims */
:root{
  --bg:#f5f7f4; --surface:#ffffff; --sunk:#eaefe9; --line:#d5ddd4;
  --ink:#16231d; --muted:#5a6b62;
  --brand:#1f4d3f; --brand-ink:#ffffff; --tag:#e8a317; --tag-ink:#2a1d00;
  --ok:#1f7a4d; --ok-bg:#e1f2e8; --warn:#9a6400; --warn-bg:#fbefd5; --bad:#b3261e; --bad-bg:#fbe3e1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211c; --sunk:#1d2a24; --line:#2c3b34;
  --ink:#e4ece7; --muted:#9aaba2;
  --brand:#7cc4a7; --brand-ink:#0b1a14; --tag:#f0b43a; --tag-ink:#2a1d00;
  --ok:#6fd39f; --ok-bg:#163326; --warn:#f0c062; --warn-bg:#33280f; --bad:#ff8a80; --bad-bg:#3a1a18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211c; --sunk:#1d2a24; --line:#2c3b34;
  --ink:#e4ece7; --muted:#9aaba2;
  --brand:#7cc4a7; --brand-ink:#0b1a14; --tag:#f0b43a; --tag-ink:#2a1d00;
  --ok:#6fd39f; --ok-bg:#163326; --warn:#f0c062; --warn-bg:#33280f; --bad:#ff8a80; --bad-bg:#3a1a18;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 15px var(--display)}
.save{font:12px var(--mono);color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav a{flex:none;padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
nav a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
main{padding-block:24px 64px;display:grid;gap:20px}
.lead{color:var(--muted);max-width:62ch}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
button,.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button:hover{filter:brightness(.97)}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner b{color:var(--warn)}
.phase{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.phase button{border:0;border-radius:999px;padding:6px 14px;background:transparent;color:var(--muted)}
.phase button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.c,th.c{text-align:center;width:52px}
.tw{overflow-x:auto}
.yn{font:600 12px var(--mono);border-radius:6px;padding:4px 0;width:38px;justify-content:center}
.yn[data-v="Y"]{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.yn[data-v="N"]{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ph{position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .meta{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font:10px/1.3 var(--mono);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;padding:2px 7px;font-size:12px}
.tagchip{display:inline-block;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tagchip.ok{background:var(--ok-bg);color:var(--ok)}
.tagchip.warn{background:var(--warn-bg);color:var(--warn)}
.tagchip.bad{background:var(--bad-bg);color:var(--bad)}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font:700 1.6rem var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp h4{margin:0 0 4px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.verdict{border-left:4px solid var(--line);padding:6px 0 6px 12px;display:grid;gap:4px}
.verdict.ok{border-color:var(--ok)} .verdict.warn{border-color:var(--tag)} .verdict.bad{border-color:var(--bad)}
.letter{white-space:pre-wrap;font:13.5px/1.6 var(--body);background:var(--sunk);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.fine{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:400}
.check input{width:auto;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- storage: IndexedDB on this device only ---------- */
let idb = null;
function openDB(){
  return new Promise(res => {
    try{
      const rq = indexedDB.open("rentready",1);
      rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore("kv"); d.createObjectStore("photos"); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
function tx(store, mode, fn){
  return new Promise(res => {
    if(!idb) return res(null);
    try{ const t = idb.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); }
    catch(e){ res(null); }
  });
}
const memPhotos = new Map();
async function putPhoto(id, blob){ memPhotos.set(id, blob); await tx("photos","readwrite", s => s.put(blob, id)); }
async function getPhoto(id){ if(memPhotos.has(id)) return memPhotos.get(id); const b = await tx("photos","readonly", s => s.get(id)); if(b) memPhotos.set(id,b); return b; }
async function delPhoto(id){ memPhotos.delete(id); await tx("photos","readwrite", s => s.delete(id)); }
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  $("#saveState").textContent = "Saving…";
  saveTimer = setTimeout(async () => {
    await tx("kv","readwrite", s => s.put(JSON.stringify(S), "state"));
    $("#saveState").textContent = idb ? "Saved on this device" : "Not saved (storage blocked)";
  }, 300);
}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
async function sha256(blob){
  try{ const buf = await blob.arrayBuffer(); const h = await crypto.subtle.digest("SHA-256", buf); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ return "unavailable"; }
}
async function shrink(file){
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok,no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    return await new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.85));
  }catch(e){ return file; }
}
const blobToDataURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){ toast("Select the text and copy it manually"); }
}

async function offerFile(filename, data){
  if(!downloads){
    if(window.claude){ toast("Saving files isn't available here"); return; }
    const url = URL.createObjectURL(new Blob([data])); const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Saved " + filename); return;
  }
  try{ await downloads.save({filename, data}); toast("Saved " + filename); }
  catch(e){ if(e && e.code !== "declined") toast("Couldn't save the file"); }
}

function assess(c){
  const R = RULES[S.tenancy.state], cat = CATS[c.cat] || CATS.other, amt = +c.amount || 0;
  const reasons = []; let fair = amt, level = "ok";
  if(c.noted === "yes"){ fair = 0; level = "bad"; reasons.push("It was already recorded at move-in, so it isn't damage you caused."); }
  if(c.wear && c.cat !== "rent"){ fair = 0; level = "bad"; reasons.push("Fair wear and tear from normal living can't be taken from your bond."); }
  if(cat.life && +c.age && fair > 0){
    const left = Math.max(0, 1 - (+c.age)/cat.life); const dep = Math.round(amt*left);
    if(dep < fair){ fair = dep; if(level==="ok") level = "warn"; reasons.push(`At ${c.age} years old with a typical life of about ${cat.life} years, its remaining value is around ${money(dep)}. You shouldn't pay for a brand-new replacement.`); }
  }
  if(c.evidence === "no"){ if(level==="ok") level = "warn"; reasons.push(R.evidenceNote); }
  if(c.noted === "unsure" && level==="ok"){ level = "warn"; reasons.push("Check your move-in report and photos for this item."); }
  if(!reasons.length) reasons.push("This looks like a fair claim if the amount matches the evidence.");
  const label = level==="bad" ? "Dispute" : level==="warn" ? "Negotiate" : "Likely fair";
  return {fair, level, label, reasons};
}

function addMonths(d,m){ const x = new Date(d); x.setMonth(x.getMonth()+m); return x; }
function viewRent(){
  const r = S.rent, R = RULES[S.tenancy.state];
  const checks = [];
  if(r.notice && r.start){
    const days = Math.round((new Date(r.start) - new Date(r.notice))/864e5);
    const need = R.rentNoticeMonths ? Math.round((addMonths(r.notice, R.rentNoticeMonths) - new Date(r.notice))/864e5) : R.rentNotice;
    const needTxt = R.rentNoticeMonths ? `${R.rentNoticeMonths} months'` : `${R.rentNotice} days'`;
    checks.push({ok: days >= need, t:`Notice: ${days} days before the new rent starts`, d: days >= need ? `Meets the minimum of ${needTxt} written notice.` : `Less than the ${needTxt} written notice required. The increase can't start on this date.`});
  }
  if(r.last && r.start){
    const earliest = addMonths(r.last, R.rentGapMonths); const ok = new Date(r.start) >= earliest;
    checks.push({ok, t:`Last increase: ${fmtDate(r.last)}`, d: ok ? `At least ${R.rentGapMonths} months since the last increase.` : `Rent can only go up once every ${R.rentGapMonths} months. The earliest date is ${fmtDate(earliest)}.`});
  }
  if(r.lease === "fixed") checks.push({ok:null, t:"Fixed-term lease", d:"During a fixed term, rent can only go up if your agreement allows it and says how the increase is worked out. Check your lease."});
  const pct = r.current && r.proposed ? ((+r.proposed - +r.current)/+r.current*100) : null;
  return `${exampleBanner()}
  <section class="stack"><h2>Rent increase check</h2><p class="lead">Got a rent increase notice? Check it against the ${esc(R.name)} rules on notice and frequency.</p></section>
  <div class="card"><div class="grid2">
    <label>Lease type<select id="r-lease" data-r="lease"><option value="periodic" ${r.lease==="periodic"?"selected":""}>Periodic (month to month)</option><option value="fixed" ${r.lease==="fixed"?"selected":""}>Fixed term</option></select></label>
    <label>Date of last increase (or move-in)<input id="r-last" data-r="last" type="date" value="${esc(r.last)}"></label>
    <label>Date you got the notice<input id="r-notice" data-r="notice" type="date" value="${esc(r.notice)}"></label>
    <label>New rent starts<input id="r-start" data-r="start" type="date" value="${esc(r.start)}"></label>
    <label>Current rent ($/week)<input id="r-current" data-r="current" type="number" inputmode="decimal" value="${esc(r.current)}"></label>
    <label>New rent ($/week)<input id="r-proposed" data-r="proposed" type="number" inputmode="decimal" value="${esc(r.proposed)}"></label>
  </div></div>
  ${pct!==null ? `<div class="stats"><div class="stat"><div class="n">${pct>=0?"+":""}${pct.toFixed(1)}%</div><div class="l">Increase</div></div><div class="stat"><div class="n">${money((+r.proposed - +r.current)*52)}</div><div class="l">Extra per year</div></div></div>` : ""}
  ${checks.map(c => `<div class="card"><div class="verdict ${c.ok===null?"warn":c.ok?"ok":"bad"}"><div class="row"><span class="tagchip ${c.ok===null?"warn":c.ok?"ok":"bad"}">${c.ok===null?"Check":c.ok?"OK":"Not valid"}</span><strong>${esc(c.t)}</strong></div><p>${esc(c.d)}</p></div></div>`).join("")}

}

<h1>${kind==="out"?"Move-out comparison":"Move-in condition report"}</h1>
<p><b>Property:</b> ${esc(t.address)}<br><b>Tenants:</b> ${esc(t.tenants)}<br><b>Agent / landlord:</b> ${esc(t.agent)}<br><b>Move-in:</b> ${fmtDate(t.moveIn)} &nbsp; <b>Move-out:</b> ${fmtDate(t.moveOut)}<br><b>State:</b> ${R.name}. Layout follows the ${R.form} (C = clean, U = undamaged, W = working).</p>
<p>Generated by RentReady on ${fmtStamp(Date.now())}. Each photo shows the time it was taken (from the device file) and a SHA-256 fingerprint of the file as it was added.</p>
${body}</body></html>`;
}

/* ---------- render + events ---------- */
const VIEWS = {tenancy:viewTenancy, inspect:viewInspect, compare:viewCompare, bond:viewBond, rent:viewRent};
function route(){ const h = location.hash.slice(1); return VIEWS[h] ? h : "tenancy"; }
function render(){
  const r = route();
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href")==="#"+r ? "page" : "false"));
  const focusId = document.activeElement && document.activeElement.id;
  $("#app").innerHTML = VIEWS[r]();
  if(focusId){ const el = document.getElementById(focusId); if(el){ el.focus(); if(el.setSelectionRange && el.type==="text") { const n = el.value.length; try{el.setSelectionRange(n,n);}catch(e){} } } }
  hydratePhotos();
}
async function hydratePhotos(){
  for(const img of document.querySelectorAll("img[data-pid]")){
    const b = await getPhoto(img.dataset.pid); if(b) img.src = URL.createObjectURL(b);
  }
}
const findItem = (rid, iid) => { const r = S.rooms.find(x=>x.id===rid); return r && r.items.find(x=>x.id===iid); };
function leaveExample(){ if(S.example){ S.example = false; } }

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act==="fresh"){ for(const p of S.photos) await delPhoto(p.id); S = emptyState(); save(); render(); toast("Started a new tenancy"); return; }
  if(act==="phase"){ phase = b.dataset.p; render(); return; }
  if(act==="toggle"){ openRoom = openRoom===b.dataset.room ? null : b.dataset.room; render(); return; }
  if(act==="yn"){ const it = findItem(b.dataset.room, b.dataset.item); const k = b.dataset.key; it[phase][k] = ({"":"Y","Y":"N","N":""})[it[phase][k]||""]; save(); render(); return; }
  if(act==="allY"){ const r = S.rooms.find(x=>x.id===b.dataset.room); r.items.forEach(i => ["c","u","w"].forEach(k => { if(!i[phase][k]) i[phase][k] = "Y"; })); save(); render(); return; }
  if(act==="addRoom"){ const v = $("#newRoom").value.trim(); if(!v) return; const id = uid(); S.rooms.push({id, name:v, items:["Walls","Floor","Windows","Light fittings"].map(n=>({id:uid(),name:n,in:blankCond(),out:blankCond()}))}); openRoom = id; save(); render(); return; }
  if(act==="delPhoto"){ const id = b.dataset.pid; S.photos = S.photos.filter(p=>p.id!==id); await delPhoto(id); save(); render(); return; }
  if(act==="addClaim"){ S.claims.push({id:uid(), desc:"", cat:"cleaning", amount:"", noted:"no", evidence:"no", wear:false, age:""}); save(); render(); return; }
  if(act==="delClaim"){ S.claims = S.claims.filter(c=>c.id!==b.dataset.c); save(); render(); return; }
  if(act==="copyLetter"){ copyText($("#letter").textContent); return; }
  if(act==="saveLetter"){ offerFile("bond-reply.txt", $("#letter").textContent); return; }
  if(act==="export-in" || act==="export-out"){ const k = act==="export-in"?"in":"out"; toast("Building report…"); offerFile(k==="in"?"move-in-condition-report.html":"move-out-comparison.html", await reportHTML(k)); return; }
  if(act==="backup"){ offerFile("rentready-backup.json", JSON.stringify(S, null, 2)); return; }
});
document.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.t){ S.tenancy[el.dataset.t] = el.value; save(); if(el.tagName==="SELECT") render(); return; }
  if(el.dataset.note){ const it = findItem(el.dataset.room, el.dataset.note); it[phase].note = el.value; save(); return; }
  if(el.dataset.c){ const c = S.claims.find(x=>x.id===el.dataset.c); const f = el.dataset.f; c[f] = el.type==="checkbox" ? el.checked : el.value; save(); clearTimeout(viewBond.t); viewBond.t = setTimeout(render, el.tagName==="SELECT"||el.type==="checkbox"?0:500); return; }
  if(el.dataset.r){ S.rent[el.dataset.r] = el.value; save(); clearTimeout(viewRent.t); viewRent.t = setTimeout(render, el.tagName==="SELECT"?0:500); return; }
});
document.addEventListener("change", async e => {
  const el = e.target; if(!el.dataset.upload) return;
  const room = el.dataset.upload, files = [...el.files]; if(!files.length) return;
  toast(`Adding ${files.length} photo${files.length>1?"s":""}…`);
  for(const f of files){
    const blob = await shrink(f); const id = uid();
    const hash = await sha256(blob);
    await putPhoto(id, blob);
    S.photos.push({id, room, phase, name:f.name, taken: f.lastModified || Date.now(), added: Date.now(), hash});
  }
  save(); render(); toast("Photos added");
});
window.addEventListener("hashchange", render);

(async () => {
  render();
  idb = await openDB();
  const raw = await tx("kv","readonly", s => s.get("state"));
  if(raw){ try{ S = JSON.parse(raw); }catch(e){} }
  if(!idb) $("#saveState").textContent = "Not saved (storage blocked)";
  render();
})();
})();
</script>
